<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
	<title>Factoring Trinomials, step 4: Check by multiplying (FOIL)</title>
	<rect width="800" height="450" rx="14" fill="#2b3035"/>
	<rect x="8" y="8" width="784" height="434" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
	<rect x="32" y="30" width="134" height="34" rx="17" fill="#ffd866"/>
	<text x="99" y="53" text-anchor="middle" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#2b3035" letter-spacing="1">STEP 4 / 4</text>
	<text x="182" y="56" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">Check by multiplying (FOIL)</text>
	<text x="40" y="104" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#9aa3ad">Example: Factor x² + 5x + 6</text>
	<line x1="40" y1="124" x2="760" y2="124" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6"/>
	<text x="40" y="177.0" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="23.142857142857142" fill="#9aa3ad">x² + 5x + 6</text>
	<text x="40" y="215.6" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="23.142857142857142" fill="#9aa3ad">b = 5,  c = 6</text>
	<text x="40" y="254.1" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="23.142857142857142" fill="#9aa3ad">1 · 6  →  sum 7</text>
	<text x="40" y="292.7" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="23.142857142857142" fill="#9aa3ad">2 · 3  →  sum 5 ✓</text>
	<text x="40" y="331.3" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="23.142857142857142" fill="#9aa3ad">(x + 2)(x + 3)</text>
	<text x="40" y="369.9" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="27.77142857142857" fill="#ffd866">x² + 3x + 2x + 6</text>
	<text x="40" y="408.4" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="27.77142857142857" fill="#ffd866">= x² + 5x + 6 ✓</text>
	
	<text x="768" y="428" text-anchor="end" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" fill-opacity="0.25" letter-spacing="2">COMPLEX MATH</text>
</svg>
