	<text x="40" y="186.4" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="31.2" fill="#9aa3ad">2x² + 3x − 2 = 0</text>
	<text x="40" y="238.4" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="31.2" fill="#9aa3ad">a = 2,  b = 3,  c = −2</text>
	<text x="40" y="290.4" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="33" fill="#ffd866">b² − 4ac = 3² − 4(2)(−2)</text>
	<text x="40" y="342.4" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="37.44" fill="#ffd866">= 9 + 16 = 25</text>
