<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
	<title>The Pythagorean Theorem, step 1: Label the sides</title>
	<rect width="800" height="450" rx="14" fill="#2b3035"/>
	<rect x="8" y="8" width="784" height="434" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
	<rect x="32" y="30" width="134" height="34" rx="17" fill="#ffd866"/>
	<text x="99" y="53" text-anchor="middle" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#2b3035" letter-spacing="1">STEP 1 / 4</text>
	<text x="182" y="56" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">Label the sides</text>
	<text x="40" y="104" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#9aa3ad">Example: Legs of 3 and 4. Find the hypotenuse.</text>
	<line x1="40" y1="124" x2="760" y2="124" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6"/>
	<text x="40" y="186.4" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="37.44" fill="#ffd866">a = 3,  b = 4,  c = ?</text>
	<g>
		<polygon points="550,170 550,360 730,360" stroke="#f2f4f7" stroke-width="3" fill="none" stroke-linejoin="round"/>
		<polyline points="550,338 572,338 572,360" stroke="#ffd866" stroke-width="2" fill="none"/>
		<text x="536" y="265" text-anchor="end" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="20" fill="#f2f4f7">a = 3</text>
		<text x="640" y="390" text-anchor="middle" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="20" fill="#f2f4f7">b = 4</text>
		<text x="662" y="257" text-anchor="start" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="20" fill="#f2f4f7">c = ?</text>
	</g>
	<text x="768" y="428" text-anchor="end" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" fill-opacity="0.25" letter-spacing="2">COMPLEX MATH</text>
</svg>
