<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
	<title>Area of a Triangle, step 1: Find the base and height</title>
	<rect width="800" height="450" rx="14" fill="#2b3035"/>
	<rect x="8" y="8" width="784" height="434" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
	<rect x="32" y="30" width="134" height="34" rx="17" fill="#ffd866"/>
	<text x="99" y="53" text-anchor="middle" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#2b3035" letter-spacing="1">STEP 1 / 3</text>
	<text x="182" y="56" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#f2f4f7">Find the base and height</text>
	<text x="40" y="104" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#9aa3ad">Example: Base of 8 cm and height of 5 cm</text>
	<line x1="40" y1="124" x2="760" y2="124" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6"/>
	<text x="40" y="186.4" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="37.44" fill="#ffd866">b = 8 cm,  h = 5 cm</text>
	<g>
		<polygon points="530,350 760,350 600,180" stroke="#f2f4f7" stroke-width="3" fill="none" stroke-linejoin="round"/>
		<line x1="600" y1="180" x2="600" y2="350" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="8 6"/>
		<polyline points="600,334 616,334 616,350" stroke="#ffd866" stroke-width="2" fill="none"/>
		<text x="610" y="265" text-anchor="start" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="20" fill="#f2f4f7">h = 5 cm</text>
		<text x="645" y="382" text-anchor="middle" font-family="'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="20" fill="#f2f4f7">b = 8 cm</text>
	</g>
	<text x="768" y="428" text-anchor="end" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" fill-opacity="0.25" letter-spacing="2">COMPLEX MATH</text>
</svg>
